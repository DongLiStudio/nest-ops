server {
  listen 8443 ssl;
  server_name auth.example.com;
  ssl_certificate /certs/fullchain.pem;
  ssl_certificate_key /certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  location / { proxy_pass http://authelia:9091; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $remote_addr; }
}
