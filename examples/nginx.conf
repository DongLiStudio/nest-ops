pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server_tokens off;
  server { listen 8080; server_name @DASHBOARD_HOST@ @AUTH_HOST@; return 301 https://$host$request_uri; }
  server {
    listen 8443 ssl;
    server_name @DASHBOARD_HOST@;
    ssl_certificate /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location /_ops/ { proxy_pass http://console:18182/; proxy_set_header Cookie $http_cookie; proxy_set_header Host $host; client_max_body_size 32k; }
    location = /_home_status/ingest { limit_except POST { deny all; } client_max_body_size 8k; proxy_pass http://status:18181/ingest; access_log off; }
    location / {
      proxy_pass http://homepage:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_http_version 1.1;
      # Homepage emits an English HTML locale even with Chinese settings.
      # Match custom.js at first paint, before browser translation detection.
      proxy_set_header Accept-Encoding "";
      sub_filter '<html lang="en">' '<html lang="zh-CN" translate="no">';
      sub_filter_once on;
    }
  }
  # Enable examples/authelia-nginx.conf inside this http block when using OIDC.
}
