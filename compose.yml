name: ${COMPOSE_PROJECT_NAME:-nest-ops}
x-log: &id001
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
x-isolation:
  restart: unless-stopped
  read_only: true
  cap_drop: &id002
  - ALL
  security_opt: &id003
  - no-new-privileges:true
  logging: *id001
services:
  homepage:
    image: ${HOMEPAGE_IMAGE}
    restart: unless-stopped
    env_file:
    - ./runtime/homepage.env
    environment:
      HOSTNAME: 0.0.0.0
      TZ: ${TZ:-UTC}
      HOMEPAGE_ALLOWED_HOSTS: ${DASHBOARD_HOST},homepage:3000
    volumes:
    - ./runtime/homepage:/app/config
    - ./runtime/images:/app/public/images:ro
    logging: *id001
  console:
    restart: unless-stopped
    read_only: true
    cap_drop: *id002
    security_opt: *id003
    logging: *id001
    image: ${PYTHON_IMAGE}
    user: 1000:1000
    command:
    - python
    - -B
    - /app/server.py
    environment:
      OPS_BIND: 0.0.0.0
      OPS_DATA: /data
      OPS_REGISTRY: /config/registry.json
      OPS_TOKENS: /config/tokens.json
      OPS_ENTRIES: /config/entries.json
      OPS_NOTIFY: /config/notify.json
      OPS_SESSION_URL: http://homepage:3000/api/auth/session
      OPS_SESSION_HOST: ${DASHBOARD_HOST}
      OPS_PUBLIC_URL: https://${DASHBOARD_HOST}
      OPS_HOUSEHOLD_URL: http://status:18181
    volumes:
    - ./console:/app:ro
    - ./runtime/console:/config:ro
    - ./runtime/history:/data
    tmpfs:
    - /tmp
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen("http://localhost:18182/health",timeout=2)
      interval: 30s
      timeout: 5s
      retries: 3
  status:
    restart: unless-stopped
    read_only: true
    cap_drop: *id002
    security_opt: *id003
    logging: *id001
    image: ${PYTHON_IMAGE}
    user: 1000:1000
    command:
    - python
    - -B
    - /app/server.py
    environment:
      DNS_DOMAIN: ${HOME_DNS_DOMAIN}
      MAX_AGE: '60'
    volumes:
    - ./status:/app:ro
    - ./runtime/status:/data
    - ./runtime/secrets/status-token:/run/secrets/status-token:ro
    tmpfs:
    - /tmp
networks:
  default:
    external: true
    name: ${NESTOPS_NETWORK:-nestops-edge}
